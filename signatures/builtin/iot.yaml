id: iot-mikrotik
name: MikroTik RouterOS
version: 1
scope: http
categories: [iot, admin_panel]
priority: 30
confidence: 0.85
technology: {name: MikroTik RouterOS, category: iot}
match:
  any:
    - {part: title, op: icontains, value: RouterOS}
    - {part: body, op: contains, value: 'mikrotik'}
export: {defectdojo: true, title: "MikroTik RouterOS management interface exposed"}

id: iot-telnet-busybox
name: Telnet na urządzeniu embedded (BusyBox)
version: 1
scope: service
categories: [iot]
priority: 25
confidence: 0.8
severity: low
match:
  all:
    - {part: port, op: in, value: [23, 2323]}
    - any:
        - {part: banner, op: icontains, value: busybox}
        - {part: banner, op: icontains, value: login}
        - {part: service, op: equals, value: telnet}
export: {defectdojo: true, title: "Telnet service on embedded device"}

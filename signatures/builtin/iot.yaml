id: iot-goahead
name: Urządzenie embedded (GoAhead)
description: Serwer GoAhead-Webs – typowy dla kamer IP i rejestratorów.
version: 1
scope: http
categories: [iot]
priority: 20
confidence: 0.8
technology: {name: GoAhead, category: iot}
match:
  any:
    - {part: header, name: Server, op: icontains, value: GoAhead}
---
id: iot-ip-camera
name: Kamera IP
version: 1
scope: http
categories: [iot]
priority: 25
confidence: 0.75
match:
  any:
    - {part: title, op: regex, value: '(?i)network camera|ip camera|web ?viewer|dvr|nvr'}
    - {part: header, name: Server, op: icontains, value: Hikvision}
    - {part: header, name: Server, op: icontains, value: 'App-webs'}
    - {part: favicon_mmh3, op: equals, value: "999357577"}
export: {defectdojo: true, title: "IP camera web interface exposed"}
---
id: iot-hp-printer
name: Drukarka HP
version: 1
scope: http
categories: [iot]
priority: 15
confidence: 0.85
technology:
  name: HP Printer
  category: iot
  version_from: {part: body, regex: '(?i)firmware[^0-9]{0,40}([0-9][0-9A-Z.]+)'}
match:
  any:
    - {part: title, op: regex, value: '(?i)hp (laserjet|officejet|color laserjet|designjet)'}
    - {part: header, name: Server, op: icontains, value: 'HP HTTP Server'}

id: installer-wordpress
name: Nieukończona instalacja WordPress
description: Instalator WordPress dostępny publicznie – pierwsza osoba, która go dokończy, przejmuje witrynę.
version: 1
scope: http
categories: [exposed_installer, cms]
severity: medium
priority: 45
confidence: 0.9
technology:
  name: WordPress
  category: cms
  version_from: {part: body, regex: 'install(?:\.min)?\.css\?ver=([0-9.]+)'}
match:
  any:
    - {part: redirect_location, op: contains, value: /wp-admin/install.php}
    - {part: title, op: icontains, value: "WordPress › Installation"}
    - {part: title, op: icontains, value: "WordPress &rsaquo; Installation"}
    - {part: body, op: contains, value: 'wp-admin/css/install'}
export: {defectdojo: true, title: "WordPress installer exposed (installation not completed)"}
---
id: installer-wordpress-path
name: Instalator WordPress pod /wp-admin/install.php
version: 1
scope: http
categories: [exposed_installer, cms]
severity: medium
priority: 45
confidence: 0.9
technology:
  name: WordPress
  category: cms
  version_from: {part: body, regex: 'install(?:\.min)?\.css\?ver=([0-9.]+)'}
request: {method: GET, path: /wp-admin/install.php}
match:
  all:
    - {part: status, op: equals, value: "200"}
    - {part: soft404, op: equals, value: "false"}
    - {part: body, op: regex, value: 'id="setup"|name="weblog_title"|wp-admin/css/install'}
export: {defectdojo: true, title: "WordPress installer exposed (installation not completed)"}

id: cms-drupal
name: Drupal
version: 1
scope: http
categories: [cms]
priority: 10
confidence: 0.85
technology:
  name: Drupal
  category: cms
  version_from: {part: header, name: X-Generator, regex: 'Drupal ([0-9.]+)'}
match:
  any:
    - {part: header, name: X-Generator, op: icontains, value: drupal}
    - {part: header, name: X-Drupal-Cache, op: exists}
    - {part: body, op: regex, value: 'Drupal\.settings|data-drupal-'}

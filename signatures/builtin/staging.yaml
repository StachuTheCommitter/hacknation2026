id: staging-hostname
name: Środowisko testowe (nazwa hosta)
version: 1
scope: http
categories: [staging]
priority: 20
confidence: 0.7
match:
  any:
    - {part: vhost, op: regex, value: '(?i)(^|[.-])(dev|test|testing|stage|staging|uat|preprod|qa|demo)([.-]|$)'}
    - {part: tls_subject_cn, op: regex, value: '(?i)(^|[.-])(dev|test|stage|staging|uat|preprod|qa)([.-]|$)'}
    - {part: tls_san, op: regex, value: '(?i)(^|[.-])(dev|test|stage|staging|uat|preprod|qa)([.-]|$)'}
export: {defectdojo: true, title: "Staging / test environment exposed"}

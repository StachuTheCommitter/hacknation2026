id: staging-title-header
name: Środowisko testowe (tytuł lub nagłówek)
version: 1
scope: http
categories: [staging]
priority: 20
confidence: 0.8
match:
  any:
    - {part: title, op: regex, value: '(?i)\b(staging|stage|test environment|testowe|development|dev server|uat|preprod)\b'}
    - {part: header, name: X-Environment, op: regex, value: '(?i)staging|dev|test|uat'}
    - {part: header, name: X-Env, op: regex, value: '(?i)staging|dev|test|uat'}
export: {defectdojo: true, title: "Staging / test environment exposed"}

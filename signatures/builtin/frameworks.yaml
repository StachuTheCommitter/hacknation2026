id: fw-spring-actuator
name: Spring Boot Actuator – endpoint publiczny
version: 1
scope: http
categories: [framework, debug_exposure]
priority: 25
confidence: 0.85
severity: low
request: {method: GET, path: /actuator/health}
match:
  all:
    - {part: status, op: equals, value: "200"}
    - {part: soft404, op: equals, value: "false"}
    - {part: body, op: regex, value: '"status"\s*:\s*"(UP|DOWN)"'}
export: {defectdojo: true, title: "Spring Boot Actuator endpoint exposed"}

id: srv-tomcat
name: Apache Tomcat
version: 1
scope: http
categories: [app_server]
priority: 5
confidence: 0.8
technology:
  name: Apache Tomcat
  category: app_server
  version_from: {part: title, regex: 'Apache Tomcat/([0-9.]+)'}
match:
  any:
    - {part: title, op: icontains, value: apache tomcat}
    - {part: body, op: contains, value: 'Apache Tomcat'}
---
id: srv-tomcat-manager
name: Tomcat Manager
version: 1
scope: http
categories: [app_server, admin_panel]
priority: 30
confidence: 0.9
request: {method: GET, path: /manager/html}
match:
  all:
    - {part: status, op: in, value: [401, 403, 200]}
    - {part: soft404, op: equals, value: "false"}
    - any:
        - {part: header, name: WWW-Authenticate, op: icontains, value: 'Tomcat Manager'}
        - {part: body, op: contains, value: 'Tomcat Web Application Manager'}
        - {part: body, op: contains, value: 'manager-gui'}
export: {defectdojo: true, title: "Tomcat Manager interface exposed"}

# Lokalny DefectDojo dla ASI (zalecenie mentorów – zamiast instancji demo).
#   make dojo   →  docker compose -f docker-compose.yml -f deploy/defectdojo.yml up -d
# UI DefectDojo: http://localhost:${DD_PORT:-8880} (admin / DD_ADMIN_PASSWORD z .env).
# ASI łączy się z nim po sieci compose (http://dd-nginx:8080) i sam pobiera token API.
# Na podstawie oficjalnego docker-compose.yml DefectDojo; obrazy z Docker Hub (wersja przypięta).

x-dd-env: &dd-env
  DD_DATABASE_URL: postgresql://defectdojo:${DD_DATABASE_PASSWORD:-defectdojo}@dd-postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://dd-valkey:6379/0
  DD_CACHE_URL: redis://dd-valkey:6379/1
  DD_SECRET_KEY: ${DD_SECRET_KEY:?uruchom make env – brak DD_SECRET_KEY w .env}
  DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?brak DD_CREDENTIAL_AES_256_KEY w .env}
  DD_DATABASE_READINESS_TIMEOUT: "60"
  DD_ALLOWED_HOSTS: "*"

x-dd-image: &dd-image
  image: defectdojo/defectdojo-django:${DD_VERSION:-3.5.202}

services:
  server:
    environment:
      ASI_DD_URL: http://dd-nginx:8080
      ASI_DD_USER: admin
      ASI_DD_PASSWORD: ${DD_ADMIN_PASSWORD:?brak DD_ADMIN_PASSWORD w .env}

  dd-nginx:
    image: defectdojo/defectdojo-nginx:${DD_VERSION:-3.5.202}
    depends_on: [dd-uwsgi]
    environment:
      DD_UWSGI_HOST: dd-uwsgi
      DD_UWSGI_PORT: "3031"
      NGINX_METRICS_ENABLED: "false"
    volumes: [dd_media:/usr/share/nginx/html/media]
    ports: ["${DD_PORT:-8880}:8080"]
    restart: unless-stopped

  dd-uwsgi:
    <<: *dd-image
    depends_on:
      dd-initializer: {condition: service_completed_successfully}
      dd-postgres: {condition: service_started}
      dd-valkey: {condition: service_started}
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh"]
    environment:
      <<: *dd-env
      DD_DEBUG: "False"
    volumes: [dd_media:/app/media]
    restart: unless-stopped

  dd-celerybeat:
    <<: *dd-image
    depends_on:
      dd-initializer: {condition: service_completed_successfully}
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-celery-beat.sh"]
    environment: *dd-env
    restart: unless-stopped

  dd-celeryworker:
    <<: *dd-image
    depends_on:
      dd-initializer: {condition: service_completed_successfully}
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh"]
    environment: *dd-env
    volumes: [dd_media:/app/media]
    restart: unless-stopped

  dd-initializer:
    <<: *dd-image
    depends_on: [dd-postgres]
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *dd-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD}
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: ASI
      DD_INITIALIZE: "true"
    restart: "no"

  dd-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:-defectdojo}
      PGDATA: /var/lib/postgresql/data
    volumes: [dd_postgres:/var/lib/postgresql/data]
    restart: unless-stopped

  dd-valkey:
    image: valkey/valkey:9.1.2-alpine
    volumes: [dd_valkey:/data]
    restart: unless-stopped

volumes:
  dd_postgres:
  dd_media:
  dd_valkey:

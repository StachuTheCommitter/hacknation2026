# Jeden adres IP, różne strony zależnie od nagłówka Host (vhosty) – na sam IP strona domyślna nginx.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
}
server {
    listen 80;
    server_name portal.lab.local;
    add_header X-Frame-Options SAMEORIGIN;
    location / { default_type text/html; return 200 '<!doctype html><html><head><title>Portal AGH Lab</title></head><body><h1>Portal</h1><a href="/login">Zaloguj</a></body></html>'; }
}
server {
    listen 80;
    server_name intranet.lab.local;
    location / { default_type text/html; return 200 '<!doctype html><html><head><title>Intranet – logowanie</title></head><body><form method="post"><input name="login"><input type="password" name="haslo"></form></body></html>'; }
}
